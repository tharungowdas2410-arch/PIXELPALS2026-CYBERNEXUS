name: CYBERNEXUS Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ----------------------------------------------------------------------------
  # Backend Test & Quality Suite
  # ----------------------------------------------------------------------------
  backend-ci:
    name: Backend Pytest & Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Alembic Migrations (SQLite Test Mode)
        working-directory: ./backend
        run: |
          alembic upgrade head

      - name: Run Full Pytest Suite
        working-directory: ./backend
        run: |
          pytest tests -v --tb=short

  # ----------------------------------------------------------------------------
  # Frontend Build & Typecheck Suite
  # ----------------------------------------------------------------------------
  frontend-ci:
    name: Frontend Lint, Typecheck & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install NPM Dependencies
        run: |
          npm ci || npm install

      - name: Run Lint
        run: |
          npm run lint

      - name: Run Next.js Production Build
        run: |
          npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://127.0.0.1:8000/api/v1"
          NEXT_TELEMETRY_DISABLED: 1
