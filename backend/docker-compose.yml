services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cybernexus
      POSTGRES_PASSWORD: cybernexus
      POSTGRES_DB: cybernexus
    ports:
      - "5432:5432"
    volumes:
      - cybernexus_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybernexus -d cybernexus"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.28-community
    environment:
      NEO4J_AUTH: neo4j/cybernexusdemo
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - cybernexus_neo4j:/data
      - cybernexus_neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  cybernexus_pg:
  cybernexus_neo4j:
  cybernexus_neo4j_logs:
