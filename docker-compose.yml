# ==============================================================================
# CYBERNEXUS — Unified Multi-Service Docker Compose Architecture
# PS ID: SIH26105 | AI-Powered Continuous Cyber Risk Quantification Platform
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Relational Database (Actuarial Models & Audit Logs)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: cybernexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cybernexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cybernexus}
      POSTGRES_DB: ${POSTGRES_DB:-cybernexus}
    ports:
      - "5432:5432"
    volumes:
      - cybernexus_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cybernexus} -d ${POSTGRES_DB:-cybernexus}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cybernexus_net

  # ----------------------------------------------------------------------------
  # 2. Neo4j Graph Database (Attack Paths & Blast Radius Traversal)
  # ----------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.28-community
    container_name: cybernexus-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-cybernexusdemo}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - cybernexus_neo4j_data:/data
      - cybernexus_neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 25s
    networks:
      - cybernexus_net

  # ----------------------------------------------------------------------------
  # 3. FastAPI Core Backend Service (Port 8000)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cybernexus-backend
    restart: unless-stopped
    environment:
      APP_NAME: CYBERNEXUS
      APP_ENV: development
      DEBUG: "false"
      API_V1_PREFIX: /api/v1
      SECRET_KEY: ${SECRET_KEY:-dev-local-secret-key-replace-in-production}
      DATABASE_URL: postgresql+asyncpg://cybernexus:cybernexus@postgres:5432/cybernexus
      DATABASE_SYNC_URL: postgresql+psycopg://cybernexus:cybernexus@postgres:5432/cybernexus
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-cybernexusdemo}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://frontend:3000
      DEMO_MODE: "true"
      AI_ENABLED: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - cybernexus_net

  # ----------------------------------------------------------------------------
  # 4. Next.js 16 Enterprise Frontend (Port 3000)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    container_name: cybernexus-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cybernexus_net

# ------------------------------------------------------------------------------
# Persistent Volume Mounts
# ------------------------------------------------------------------------------
volumes:
  cybernexus_pg_data:
    name: cybernexus_pg_data
  cybernexus_neo4j_data:
    name: cybernexus_neo4j_data
  cybernexus_neo4j_logs:
    name: cybernexus_neo4j_logs

# ------------------------------------------------------------------------------
# Isolated Internal Bridge Network
# ------------------------------------------------------------------------------
networks:
  cybernexus_net:
    name: cybernexus_net
    driver: bridge
